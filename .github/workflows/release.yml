name: release

# Runs on `git tag v*` (pushed after the owner is satisfied with `main`, per
# the version policy — see docs/guide.md). Builds + tests the same 3-OS
# matrix as ci.yml, then attaches the static libs, the shared libs,
# dist/poncelet_single.hpp, and a zipped Doxygen API reference to a GitHub
# Release — a real download page instead of a source-only tag.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPONCELET_SHARED=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage artifacts
        shell: bash
        # The static lib is poncelet.lib (MSVC, multi-config -> build/Release/)
        # or libponcelet.a (single-config Make/Ninja -> build/); the shared
        # lib is poncelet_shared.{dll,lib} / libponcelet_shared.{so,dylib}.
        # `find` (not a fixed path) so this doesn't care which generator CMake
        # picked on a given OS.
        run: |
          mkdir -p stage
          find build \( -iname 'libponcelet.a' -o -iname 'poncelet.lib' \
                      -o -iname 'libponcelet_shared.so' -o -iname 'libponcelet_shared.dylib' \
                      -o -iname 'poncelet_shared.dll' -o -iname 'poncelet_shared.lib' \) \
               -exec cp {} stage/ \;
          cp dist/poncelet_single.hpp stage/
          ls -la stage

      - uses: actions/upload-artifact@v7
        with:
          name: poncelet-${{ matrix.os }}
          path: stage/*
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate API reference
        run: doxygen docs/Doxyfile   # -> docs/api/html
      - name: Zip
        run: cd docs/api && zip -r ../../poncelet-docs-html.zip html
      - uses: actions/upload-artifact@v7
        with:
          name: poncelet-docs
          path: poncelet-docs-html.zip
          if-no-files-found: error

  release:
    needs: [build, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten per-OS staging dirs into one release asset set
        # Each poncelet-<os> artifact carries the same dist/poncelet_single.hpp
        # (harmless duplicate — actions/upload-artifact already dedupes identical
        # uploads within a job, and a same-named file here just overwrites).
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true

  nuget:
    needs: build
    runs-on: windows-latest
    permissions:
      id-token: write   # OIDC token for nuget.org Trusted Publishing (policy: poncelet-release)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # Each poncelet-<os> artifact is the flat `stage/` dir from the build
      # job (find matched by lib/dll basename, no subfolders) — pick the
      # shared lib back out by name and place it under the RID layout the
      # nuspec expects, renamed to the plain poncelet.* the C ABI header
      # (include/poncelet/poncelet.h) declares, so .NET's DllImport("poncelet")
      # resolves it via the SDK's RID graph with no per-platform name logic.
      - name: Assemble nuget-stage
        shell: bash
        run: |
          set -eu
          mkdir -p nuget-stage/include nuget-stage/build
          mkdir -p nuget-stage/runtimes/win-x64/native
          mkdir -p nuget-stage/runtimes/linux-x64/native
          mkdir -p nuget-stage/runtimes/osx-arm64/native

          cp -r include/. nuget-stage/include/
          cp nuget/Poncelet.targets nuget-stage/build/Poncelet.targets
          cp nuget/Poncelet.props nuget-stage/build/Poncelet.props

          cp artifacts/poncelet-windows-latest/poncelet_shared.dll nuget-stage/runtimes/win-x64/native/poncelet.dll
          cp artifacts/poncelet-windows-latest/poncelet_shared.lib nuget-stage/runtimes/win-x64/native/poncelet.lib
          cp artifacts/poncelet-ubuntu-latest/libponcelet_shared.so nuget-stage/runtimes/linux-x64/native/libponcelet.so
          cp artifacts/poncelet-macos-latest/libponcelet_shared.dylib nuget-stage/runtimes/osx-arm64/native/libponcelet.dylib

      - name: Derive version from tag
        shell: bash
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: NuGet/setup-nuget@v2

      - name: Pack
        run: nuget pack Poncelet.nuspec -Version ${{ env.PKG_VERSION }} -OutputDirectory nupkg -BasePath .

      # Trusted Publishing (policy "poncelet-release" on nuget.org): trades this
      # job's OIDC token for a single-use, ~1h API key — no long-lived secret
      # stored in the repo. The policy's workflow filename must be exactly
      # "release.yml" (this file) or the token exchange is rejected.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: felixmiddelhoff

      - name: Push to nuget.org
        run: dotnet nuget push nupkg\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
