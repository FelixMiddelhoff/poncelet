name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Release, Debug]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DPONCELET_SHARED=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: BitExact per-shot digests (informational)
        # Sim::stateHash(id) per shot, printed unconditionally so a
        # poncelet_bitexact_golden mismatch on this OS can be diffed
        # against another OS's run to find which shot actually diverges,
        # in this same log, without a separate round trip. Also prints the
        # guidance-law digest (bitexact-guidance-law-plan.md Phase 4) so the
        # 6 OS/config jobs' values can be hand-diffed for the actual
        # cross-platform claim — poncelet_bitexact_guidance_check itself only
        # proves same-machine repeatability, same as the RKF45 check.
        shell: bash
        run: |
          # Explicit candidate paths, not a `find -name "poncelet_bench*"` glob:
          # that wildcard used to match build/poncelet_bench.vcxproj (Windows
          # multi-config generators drop CMake project files next to the build
          # tree) before the real build/${{ matrix.config }}/poncelet_bench.exe,
          # so $BIN silently ran an XML file as a shell script on windows-latest
          # (harmless — `|| true` below — but no digest ever printed there).
          BIN=""
          for c in "build/poncelet_bench" "build/poncelet_bench.exe" \
                   "build/${{ matrix.config }}/poncelet_bench" \
                   "build/${{ matrix.config }}/poncelet_bench.exe"; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          "$BIN" --bitexact-per-shot || true
          "$BIN" --bitexact-frame-trace || true
          "$BIN" --bitexact-guidance-print || true
      - name: Test
        # Includes the validation suite (poncelet_validation), the throughput
        # gate (poncelet_perf_gate) and the cross-platform BitExact golden
        # (poncelet_bitexact_golden) — the last is why this matrix spans three
        # OSes: the Q32.32 fixed-point digest must be identical on all of them.
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - name: Bench (informational)
        run: ctest --test-dir build -C ${{ matrix.config }} -R poncelet_perf_gate -V
