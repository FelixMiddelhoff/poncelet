name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Release, Debug]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DPONCELET_SHARED=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: BitExact per-shot digests (informational)
        # Sim::stateHash(id) per shot, printed unconditionally so a
        # poncelet_bitexact_golden mismatch on this OS can be diffed
        # against another OS's run to find which shot actually diverges,
        # in this same log, without a separate round trip.
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -name "poncelet_bench*" -type f | head -1)
          "$BIN" --bitexact-per-shot || true
          "$BIN" --bitexact-frame-trace || true
      - name: Test
        # Includes the validation suite (poncelet_validation), the throughput
        # gate (poncelet_perf_gate) and the cross-platform BitExact golden
        # (poncelet_bitexact_golden) — the last is why this matrix spans three
        # OSes: the Q32.32 fixed-point digest must be identical on all of them.
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - name: Bench (informational)
        run: ctest --test-dir build -C ${{ matrix.config }} -R poncelet_perf_gate -V
